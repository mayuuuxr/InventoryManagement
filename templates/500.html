<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B3D91">
    <title>Something went wrong | nibba</title>
    <style>
        /* Standalone by design: this page must render even when the database
           or app stack is down, so no base template, no context, no icons. */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; font-size: 14px;
               color: #0F2440; background: #E8F6FF; min-height: 100vh;
               display: flex; align-items: center; justify-content: center; padding: 16px; }
        .card { background: #FFFFFF; border: 1px solid #C9E2F2; border-radius: 12px;
                padding: 32px; max-width: 28rem; width: 100%; text-align: center; }
        .mark { width: 48px; height: 48px; border-radius: 12px; background: #FEE2E2;
                color: #B42323; font-size: 24px; font-weight: 700;
                display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        h1 { font-size: 22px; margin-bottom: 8px; }
        p { color: #5C738A; margin-bottom: 8px; line-height: 1.5; }
        .row { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
        a.btn { display: inline-flex; align-items: center; justify-content: center;
                gap: 8px; padding: 10px 16px; min-height: 44px; border-radius: 12px;
                font-size: 14px; font-weight: 500; text-decoration: none; }
        a.primary { background: #0B3D91; color: #FFF; }
        a.ghost { background: #FFF; color: #0F2440; border: 1px solid #C9E2F2; }
    </style>
</head>
<body>
    <div class="card">
        <div class="mark">!</div>
        <h1>Something went wrong</h1>
        <p>The app hit an unexpected problem. If you were saving an entry, it may not have saved. Please check before retrying.</p>
        <p>Tell your shop owner what you were doing so they can look into it.</p>
        <div class="row">
            <a class="btn primary" href="/dashboard/">Back to Dashboard</a>
            <a class="btn ghost" href="/accounts/login/">Back to Login</a>
        </div>
    </div>
</body>
</html>
