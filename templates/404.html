{% extends "base.html" %}

{% block title %}Page not found | nibba{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-surface border border-subtle rounded-lg p-8 md:p-12 text-center">
        <div class="w-12 h-12 rounded-lg bg-gray-100 flex items-center justify-center mx-auto mb-4">
            <i data-lucide="search" class="w-6 h-6 text-muted"></i>
        </div>
        <h1 class="text-charcoal mb-2">Page not found</h1>
        <p class="text-sm text-muted mb-6">This link is broken, or the item (material, entry) was deleted or belongs to someone else's entries.</p>
        <div class="flex flex-col sm:flex-row sm:justify-center gap-3">
            <a href="{% url 'dashboard' %}"
               class="inline-flex items-center justify-center gap-2 px-4 py-2 min-h-[44px] md:min-h-0 bg-accent text-white text-sm font-medium rounded-xl hover:bg-accent-hover transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2">
                <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                Back to Dashboard
            </a>
            <a href="{% url 'reports:landing' %}"
               class="inline-flex items-center justify-center gap-2 px-4 py-2 min-h-[44px] md:min-h-0 bg-surface text-charcoal text-sm font-medium rounded-xl border border-subtle hover:bg-gray-50 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2">
                <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
                Reports
            </a>
        </div>
    </div>
</div>
{% endblock %}
